name: Build and engine contract
on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Build development app
        run: bash scripts/build-app.sh
      - name: Engine protocol tests (no weights)
        run: python3 -m unittest discover -s Engine -p 'test_*.py' -v
