name: Build and engine contract
on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Build development app
        run: bash scripts/build-app.sh
      - name: Native meeting audio pipeline (synthetic, no capture)
        run: build/Veloce.app/Contents/MacOS/Veloce --verify-meeting-audio "$RUNNER_TEMP/veloce-meeting-audio"
      - name: Native audio file import (synthetic, no capture)
        run: build/Veloce.app/Contents/MacOS/Veloce --verify-audio-import "$RUNNER_TEMP/veloce-audio-import"
      - name: Engine protocol tests (no weights)
        run: python3 -m unittest discover -s Engine -p 'test_*.py' -v
